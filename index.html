<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도서 모니터링 대시보드</title>
<style>
:root{
  --bg:#f5f8fc;--card:#fff;--ink:#12213f;--sub:#66738c;--line:#e5ebf4;
  --blue:#397df7;--blue2:#eaf2ff;--green:#18a875;--green2:#e8f8f1;
  --purple:#8b5cf6;--purple2:#f2edff;--red:#ef5c73;--red2:#fff0f3;
  --shadow:0 8px 26px rgba(40,67,115,.07);--radius:15px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 18px;overflow:auto}
.brand h1{font-size:22px;margin:0;letter-spacing:-.04em}.brand p{margin:3px 0 20px;color:#77849b;font-size:11px;font-weight:700}
.search{width:100%;border:1px solid #dbe3ef;border-radius:10px;padding:11px 12px;background:#fbfcfe;outline:none}
.filter-label{font-size:11px;color:var(--sub);margin:12px 0 5px}.series{width:100%;border:1px solid #dbe3ef;border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink)}
.book-list{margin-top:14px;display:flex;flex-direction:column;gap:5px}
.book-row{width:100%;border:0;background:#fff;border-radius:12px;padding:10px;display:grid;grid-template-columns:45px 1fr 16px;gap:10px;align-items:center;text-align:left;cursor:pointer;color:var(--ink)}
.book-row:hover{background:#f5f8fc}.book-row.active{background:#eaf2ff;box-shadow:inset 3px 0 0 var(--blue)}
.book-cover{width:45px;height:59px;border-radius:5px;object-fit:cover;background:#eef2f7;border:1px solid #e0e6ef}
.book-title{font-size:12px;font-weight:800;line-height:1.35;letter-spacing:-.02em}.book-pub{font-size:10px;color:#8090a9;margin-top:3px}.chev{color:#8fa0b9;font-size:18px}
.main{padding:20px 24px 38px;min-width:0}
.topline{display:flex;justify-content:flex-end;color:#738199;font-size:11px;margin-bottom:9px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.sum-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:12px}
.sum-icon{width:43px;height:43px;border-radius:11px;display:grid;place-items:center;font-size:19px;font-weight:900}.i1{background:#e8f1ff;color:var(--blue)}.i2{background:#e8f8f1;color:var(--green)}.i3{background:#f1ebff;color:var(--purple)}.i4{background:#e8f8f1;color:var(--green)}
.sum-k{font-size:11px;color:#66738c}.sum-v{font-size:22px;font-weight:900;line-height:1.15;margin-top:1px}
.hero{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:14px 18px;display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:center;margin-bottom:12px}
.hero-cover{width:88px;height:116px;object-fit:cover;border-radius:6px;border:1px solid #e2e8f0;background:#eef2f7}
.hero h2{font-size:22px;margin:0 0 4px;letter-spacing:-.04em}.meta{font-size:12px;color:#66738c}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;font-weight:800;border-radius:999px;padding:5px 9px}.tb{background:#eaf2ff;color:#3371db}.tg{background:#e8f8f1;color:#14845f}.tp{background:#f1ebff;color:#7446db}
.hero-right{min-width:150px;text-align:right;color:#8a98ad;font-size:11px;line-height:1.6}.hero-right b{color:#53627a}
.stores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.store{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}
.store-head{padding:10px 14px;font-size:15px;font-weight:900}.kh{background:#eaf8f0;color:#0e8158}.yh{background:#eaf2ff;color:#1671e8}.ah{background:#f1edff;color:#7148d8}
.metrics{display:grid;grid-template-columns:repeat(2,1fr)}.metric{padding:12px 14px;border-top:1px solid #edf1f6}.metric:nth-child(odd){border-right:1px solid #edf1f6}.metric.wide{grid-column:1/-1;border-right:0}
.mk{font-size:10px;color:#65758c}.mv{font-size:18px;font-weight:900;margin-top:2px}.ms{font-size:9px;color:#99a5b6;margin-top:2px}.delta{font-size:9px;font-weight:800;margin-left:5px;border-radius:999px;padding:2px 5px}.up{background:#fff0f3;color:#e85670}.down{background:#e9f8f1;color:#15916a}
.middle{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:12px;margin-bottom:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:14px 16px}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.panel-title h3{font-size:15px;margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{border:1px solid #e0e6ef;background:#f6f8fb;border-radius:8px;padding:5px 9px;font-size:10px;color:#65758c;cursor:pointer}.tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.chart{width:100%;height:210px;display:block}.gridline{stroke:#e9eef5;stroke-width:1}.chart-line{fill:none;stroke:var(--blue);stroke-width:2.3}.dot{fill:var(--blue);stroke:white;stroke-width:1.3}.axis{fill:#8794a7;font-size:9px}
.review-table{width:100%;border-collapse:collapse;font-size:11px}.review-table th,.review-table td{border:1px solid #e8edf4;padding:8px;text-align:center}.review-table th{background:#f7f9fc;color:#64748b}.review-table td{font-weight:700}
.reviews{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:14px 16px}
.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.review-card{border:1px solid #e4eaf2;border-radius:12px;padding:11px;background:#fff;min-height:118px}
.review-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin-bottom:6px}.review-store{font-weight:900}.rk{color:#0e8b60}.ry{color:#1671e8}.ra{color:#754bd8}.review-date{color:#93a0b2}.stars{color:#f5a623;font-size:11px;margin-bottom:5px}.review-text{font-size:11px;line-height:1.55;color:#34425a;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:#9aa6b7;font-size:11px;padding:18px 4px}.loading{display:grid;place-items:center;min-height:420px;color:#7d8aa0}
.small-note{font-size:9px;color:#9aa6b7;margin-top:8px}
@media(max-width:1150px){.app{grid-template-columns:240px 1fr}.summary{grid-template-columns:repeat(2,1fr)}.stores{grid-template-columns:1fr}.middle{grid-template-columns:1fr}.hero{grid-template-columns:72px 1fr}.hero-right{display:none}.hero-cover{width:72px;height:95px}}
@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.book-list{display:none}.main{padding:14px}.summary{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:60px 1fr}.hero-cover{width:60px;height:80px}.review-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>도서 모니터링 대시보드</h1><p>AULBOOK BOOK MONITOR</p></div>
    <input id="search" class="search" placeholder="🔎  도서 검색">
    <div class="filter-label">시리즈</div>
    <select id="series" class="series"><option value="all">전체 시리즈</option></select>
    <div id="bookList" class="book-list"></div>
  </aside>

  <main class="main">
    <div id="appBody" class="loading">데이터를 불러오는 중입니다…</div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
let books=[], latest={}, hist=[], metric='overallRank';

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const has=n=>n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n));
const num=n=>has(n)?Number(n):null;
const fmt=n=>has(n)?Number(n).toLocaleString('ko-KR'):'–';
const rank=n=>{n=num(n);return n&&n>0?`${n.toLocaleString('ko-KR')}위`:'–'};
const cover=b=>b?.yes24?`https://image.yes24.com/goods/${b.yes24}/XL`:`https://contents.kyobobook.co.kr/sih/fit-in/200x0/pdt/${b.isbn}.jpg`;
const snap=b=>latest[b?.id]||{};
const selected=()=>books.find(b=>b.id===decodeURIComponent(location.hash.slice(1)))||books[0];

async function fresh(url,type='json'){
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'_='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error(`${url} ${r.status}`);
  return type==='text'?r.text():r.json();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function load(){
  let last;
  for(let i=0;i<4;i++){
    try{
      const [b,l,h]=await Promise.all([
        fresh('books.json'),
        fresh('data/latest.json').catch(()=>({})),
        fresh('data/history.jsonl','text').catch(()=>'')
      ]);
      books=b;latest=l||{};hist=(h||'').split(/\n+/).filter(Boolean).map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean);
      if(!location.hash&&books[0]) history.replaceState(null,'','#'+books[0].id);
      initControls();renderAll();return;
    }catch(e){last=e;await wait((i+1)*700)}
  }
  $('#appBody').className='loading';
  $('#appBody').innerHTML=`데이터를 불러오지 못했습니다.<br><small>${esc(last?.message||'')}</small>`;
}
function initControls(){
  const s=$('#series'),cur=s.value;
  const arr=[...new Set(books.map(b=>b.series).filter(Boolean))];
  s.innerHTML='<option value="all">전체 시리즈</option>'+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  if([...s.options].some(o=>o.value===cur))s.value=cur;
  renderBookList();
}
function filteredBooks(){
  const q=$('#search').value.trim().toLowerCase(),ser=$('#series').value;
  return books.filter(b=>(ser==='all'||b.series===ser)&&(!q||`${b.title} ${b.isbn}`.toLowerCase().includes(q)));
}
function renderBookList(){
  const sel=selected();
  $('#bookList').innerHTML=filteredBooks().map(b=>`
    <button class="book-row ${sel?.id===b.id?'active':''}" data-id="${esc(b.id)}">
      <img class="book-cover" src="${cover(b)}" onerror="this.style.visibility='hidden'">
      <div><div class="book-title">${esc(b.title)}</div><div class="book-pub">아울북</div></div><div class="chev">›</div>
    </button>`).join('');
  document.querySelectorAll('.book-row').forEach(x=>x.onclick=()=>{location.hash=encodeURIComponent(x.dataset.id)});
}
function latestTime(){
  const ss=Object.values(latest).filter(x=>x?.t).sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  return ss[0]?.t?new Date(ss[0].t):null;
}
function prevSnap(id,currentT){
  const rows=hist.filter(x=>x?.book===id&&x?.t&&x.t!==currentT).sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  return rows[0]||null;
}
function deltaRank(cur,prev){
  cur=num(cur);prev=num(prev);
  if(!cur||!prev||cur===prev)return '';
  const d=prev-cur;
  return `<span class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}</span>`;
}
function summaryStats(){
  let rising=0,newReviews=0,collected=0;
  for(const b of books){
    const s=snap(b); if(s?.t)collected++;
    const p=prevSnap(b,s?.t);
    if(p){
      const pairs=[['kyobo','overallRank'],['yes24','overallRank'],['aladin','overallRank']];
      if(pairs.some(([k,f])=>num(s[k]?.[f])&&num(p[k]?.[f])&&num(s[k][f])<num(p[k][f]))) rising++;
      for(const k of ['kyobo','yes24','aladin']){
        const d=(num(s[k]?.reviewCount)||0)-(num(p[k]?.reviewCount)||0);
        if(d>0)newReviews+=d;
      }
    }
  }
  return {rising,newReviews,collected};
}
function metricCard(label,val,sub='',d=''){
  return `<div class="metric"><div class="mk">${label}</div><div class="mv">${val}${d}</div>${sub?`<div class="ms">${sub}</div>`:''}</div>`;
}
function storeCard(cls,name,s,p,kind){
  const pp=p?.[kind]||{};
  let extra='';
  if(kind==='kyobo') extra=metricCard('온라인 재고',fmt(s.onlineStock))+metricCard('매장 재고',fmt(s.storeStockTotal));
  if(kind==='yes24') extra=`<div class="metric wide"><div class="mk">판매지수</div><div class="mv">${fmt(s.salesIndex)}</div></div>`;
  if(kind==='aladin') extra=`<div class="metric wide"><div class="mk">Sales Point</div><div class="mv">${fmt(s.salesPoint)}</div></div>`;
  return `<section class="store">
    <div class="store-head ${cls}">${name}</div>
    <div class="metrics">
      ${metricCard('종합 베스트',rank(s.overallRank),'',deltaRank(s.overallRank,pp.overallRank))}
      ${metricCard('어린이 베스트',rank(s.childrenRank),'',deltaRank(s.childrenRank,pp.childrenRank))}
      ${metricCard('리뷰 수',fmt(s.reviewCount))}
      ${metricCard('평점',has(s.reviewScore)?fmt(s.reviewScore):'–')}
      ${extra}
    </div>
  </section>`;
}
function reviewArray(s){
  const arr=[];
  for(const [k,name,cls] of [['kyobo','교보문고','rk'],['yes24','YES24','ry'],['aladin','알라딘','ra']]){
    for(const r of (s?.[k]?.reviews||[])) arr.push({...r,store:name,cls});
  }
  return arr.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,6);
}
function chartRows(b){
  return hist.filter(x=>x?.book===b.id&&x?.t).sort((a,b)=>String(a.t).localeCompare(String(b.t))).slice(-30);
}
function metricValue(row,store){
  const x=row?.[store]||{};
  if(metric==='overallRank')return num(x.overallRank);
  if(metric==='childrenRank')return num(x.childrenRank);
  if(metric==='reviews')return num(x.reviewCount);
  if(metric==='sales')return store==='yes24'?num(x.salesIndex):store==='aladin'?num(x.salesPoint):null;
  return null;
}
function svgChart(b){
  const rows=chartRows(b), stores=[['kyobo','#18a875'],['yes24','#397df7'],['aladin','#8b5cf6']];
  const W=780,H=190,pad={l:36,r:12,t:14,b:28};
  let vals=[];
  for(const r of rows)for(const [k] of stores){const v=metricValue(r,k);if(v!==null)vals.push(v)}
  if(rows.length<2||!vals.length)return `<div class="empty">누적 데이터가 더 쌓이면 그래프가 표시됩니다.</div>`;
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn=Math.max(0,mn-1);mx+=1}
  const isRank=metric.includes('Rank');
  if(isRank){mn=Math.max(0,mn-5);mx+=5}else{mn=Math.max(0,mn-(mx-mn)*.08);mx+=(mx-mn)*.08}
  const x=i=>pad.l+i*(W-pad.l-pad.r)/Math.max(1,rows.length-1);
  const y=v=>pad.t+(v-mn)*(H-pad.t-pad.b)/(mx-mn);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let i=0;i<4;i++){const yy=pad.t+i*(H-pad.t-pad.b)/3;s+=`<line class="gridline" x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}"/>`}
  stores.forEach(([k,c])=>{
    const pts=rows.map((r,i)=>[x(i),metricValue(r,k)]).filter(p=>p[1]!==null);
    if(pts.length<2)return;
    s+=`<polyline points="${pts.map(p=>`${p[0]},${y(p[1])}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2"/>`;
    for(const p of pts)s+=`<circle cx="${p[0]}" cy="${y(p[1])}" r="2.8" fill="${c}" stroke="#fff" stroke-width="1"/>`;
  });
  [0,Math.floor(rows.length/2),rows.length-1].forEach(i=>{const d=new Date(rows[i].t);s+=`<text class="axis" x="${x(i)}" y="${H-7}" text-anchor="middle">${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}</text>`});
  s+=`</svg>`;return s;
}
function renderAll(){
  renderBookList();
  const b=selected();if(!b)return;
  const s=snap(b),p=prevSnap(b.id,s?.t),sum=summaryStats(),dt=latestTime();
  const rev=reviewArray(s);
  const reviewTotal=['kyobo','yes24','aladin'].reduce((a,k)=>a+(num(s?.[k]?.reviewCount)||0),0);

  $('#appBody').className='';
  $('#appBody').innerHTML=`
    <div class="topline">◷ 마지막 업데이트&nbsp; <b>${dt?dt.toLocaleString('ko-KR'):'아직 수집 전'}</b></div>
    <section class="summary">
      <div class="sum-card"><div class="sum-icon i1">▣</div><div><div class="sum-k">모니터링 도서</div><div class="sum-v">${books.length}권</div></div></div>
      <div class="sum-card"><div class="sum-icon i2">↗</div><div><div class="sum-k">순위 상승</div><div class="sum-v">${sum.rising}권</div></div></div>
      <div class="sum-card"><div class="sum-icon i3">●</div><div><div class="sum-k">신규 리뷰</div><div class="sum-v">${sum.newReviews}건</div></div></div>
      <div class="sum-card"><div class="sum-icon i4">✓</div><div><div class="sum-k">오늘 수집 상태</div><div class="sum-v">${sum.collected?'정상':'대기'}</div></div></div>
    </section>

    <section class="hero">
      <img class="hero-cover" src="${cover(b)}" onerror="this.style.visibility='hidden'">
      <div><h2>${esc(b.title)}</h2><div class="meta">ISBN ${esc(b.isbn)} · 아울북</div>
        <div class="tags"><span class="tag tb">리뷰 수집</span><span class="tag tg">순위 수집</span><span class="tag tp">${s?.t?'정상':'수집 대기'}</span></div>
      </div>
      <div class="hero-right"><b>교보 · YES24 · 알라딘</b><br>매시간 자동 수집<br>최근 공개 리뷰 및 순위 추적</div>
    </section>

    <section class="stores">
      ${storeCard('kh','교보문고',s.kyobo||{},p,'kyobo')}
      ${storeCard('yh','YES24',s.yes24||{},p,'yes24')}
      ${storeCard('ah','알라딘',s.aladin||{},p,'aladin')}
    </section>

    <section class="middle">
      <div class="panel">
        <div class="panel-title"><h3>추이 그래프</h3><div class="tabs">
          <button class="tab ${metric==='overallRank'?'active':''}" data-m="overallRank">종합 순위</button>
          <button class="tab ${metric==='childrenRank'?'active':''}" data-m="childrenRank">어린이 순위</button>
          <button class="tab ${metric==='sales'?'active':''}" data-m="sales">판매지수</button>
          <button class="tab ${metric==='reviews'?'active':''}" data-m="reviews">리뷰 수</button>
        </div></div>
        ${svgChart(b)}
        <div class="small-note">초록 교보문고 · 파랑 YES24 · 보라 알라딘</div>
      </div>
      <div class="panel">
        <div class="panel-title"><h3>리뷰 현황</h3><b style="font-size:11px;color:#74839a">총 ${fmt(reviewTotal)}건</b></div>
        <table class="review-table"><thead><tr><th>서점명</th><th>리뷰 수</th></tr></thead><tbody>
          <tr><td>교보문고</td><td>${fmt(s.kyobo?.reviewCount)}</td></tr>
          <tr><td>YES24</td><td>${fmt(s.yes24?.reviewCount)}</td></tr>
          <tr><td>알라딘</td><td>${fmt(s.aladin?.reviewCount)}</td></tr>
        </tbody></table>
      </div>
    </section>

    <section class="reviews">
      <div class="panel-title"><h3>최근 리뷰</h3><span style="font-size:10px;color:#8290a4">공개 리뷰 최신 ${rev.length}건</span></div>
      <div class="review-grid">${rev.length?rev.map(r=>`
        <article class="review-card">
          <div class="review-top"><span class="review-store ${r.cls}">${r.store}</span><span class="review-date">${esc(r.date||'')}</span></div>
          ${has(r.score)?`<div class="stars">★★★★★ &nbsp;<span style="color:#45536a">${esc(r.score)}</span></div>`:''}
          <div class="review-text">“${esc(r.content||'')}”</div>
        </article>`).join(''):`<div class="empty">현재 수집된 리뷰 본문이 없습니다.</div>`}</div>
    </section>`;
  document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{metric=x.dataset.m;renderAll()});
}
$('#search').addEventListener('input',renderBookList);
$('#series').addEventListener('change',renderBookList);
window.addEventListener('hashchange',renderAll);
